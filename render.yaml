# Render Blueprint — lets you create the service straight from this repo.
# In Render: New → Blueprint → pick this repo. Set the env vars marked sync:false.
services:
  - type: web
    name: bookmark-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_USER_EMAIL
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
      - key: SEED_USER_NAME
        sync: false
